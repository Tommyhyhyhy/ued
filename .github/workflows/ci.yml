name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MODE: 'true'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
